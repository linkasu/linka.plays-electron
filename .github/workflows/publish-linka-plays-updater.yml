name: Publish linka.plays updater

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, with or without v prefix"
        required: true

jobs:
  publish-updater:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LINKA_SU_SSH_KEY }}" > ~/.ssh/linka_su
          chmod 600 ~/.ssh/linka_su
          ssh-keyscan -H "${{ secrets.LINKA_SU_HOST }}" >> ~/.ssh/known_hosts

      - name: Update public installer mirror
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a numeric stable version"; exit 1; }

          ssh -i ~/.ssh/linka_su -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.LINKA_SU_USER }}@${{ secrets.LINKA_SU_HOST }}" \
            'mkdir -p /home/aacidov/linka-docker/release-tools'
          scp -i ~/.ssh/linka_su -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/publish-windows-release.mjs \
            "${{ secrets.LINKA_SU_USER }}@${{ secrets.LINKA_SU_HOST }}:/home/aacidov/linka-docker/release-tools/linka-plays-publish.mjs"

          ssh -i ~/.ssh/linka_su \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LINKA_SU_USER }}@${{ secrets.LINKA_SU_HOST }}" \
            "EXPECTED_VERSION='$expected_version' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n ln -sfn /home/aacidov/linka-docker/release-tools/linka-plays-publish.mjs /home/aacidov/linka-docker/wordpress/dist/linka.plays/update.js
          sudo -n "$(command -v node)" /home/aacidov/linka-docker/release-tools/linka-plays-publish.mjs "$EXPECTED_VERSION"
          cd /home/aacidov/linka-docker/wordpress/linkaplay

          actual_version="$(node -p "require('./version.json').version")"
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "Expected version $EXPECTED_VERSION, got $actual_version" >&2
            exit 1
          fi

          test -s linkaplaysetup.exe
          ls -lh linkaplaysetup.exe version.json launcher.zip
          REMOTE
