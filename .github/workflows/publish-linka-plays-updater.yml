name: Publish linka.plays updater

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, with or without v prefix"
        required: true

jobs:
  publish-updater:
    runs-on: ubuntu-latest
    concurrency:
      group: windows-public-mirror
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.LINKA_SU_SSH_KEY }}" > ~/.ssh/linka_su
          chmod 600 ~/.ssh/linka_su
          ssh-keyscan -H "${{ secrets.LINKA_SU_HOST }}" >> ~/.ssh/known_hosts

      - name: Update public installer mirror
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a numeric stable version"; exit 1; }

          ssh -i ~/.ssh/linka_su -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.LINKA_SU_USER }}@${{ secrets.LINKA_SU_HOST }}" \
            "mkdir -p /home/aacidov/linka-docker/release-tools/${GITHUB_SHA}"
          scp -i ~/.ssh/linka_su -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/publish-windows-release.mjs \
            "${{ secrets.LINKA_SU_USER }}@${{ secrets.LINKA_SU_HOST }}:/home/aacidov/linka-docker/release-tools/${GITHUB_SHA}/linka-plays-publish.mjs"

          ssh -i ~/.ssh/linka_su \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LINKA_SU_USER }}@${{ secrets.LINKA_SU_HOST }}" \
            "EXPECTED_VERSION='$expected_version' PUBLISHER_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          sudo -n "$(command -v node)" "/home/aacidov/linka-docker/release-tools/$PUBLISHER_SHA/linka-plays-publish.mjs" "$EXPECTED_VERSION"
          cd /home/aacidov/linka-docker/wordpress/linkaplay

          actual_version="$(node -p "require('./version.json').version")"
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "Expected version $EXPECTED_VERSION, got $actual_version" >&2
            exit 1
          fi

          test -s linkaplaysetup.exe
          ls -lh linkaplaysetup.exe version.json launcher.zip
          REMOTE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify both public mirrors against the exact release bytes
        run: node scripts/ci/verify-public-windows-release.mjs "${RELEASE_TAG#v}" > public-windows-release.json
      - name: Upload public verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Public-Windows-verification-${{ github.run_id }}
          path: public-windows-release.json
          if-no-files-found: ignore
