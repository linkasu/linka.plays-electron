name: Release linka.plays

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without v prefix"
        required: true
      publish:
        description: "Publish after installer acceptance (false builds a candidate only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.gate.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Require package.json release version
        id: gate
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          release_tag="$(node scripts/ci/release-version-gate.js "$RELEASE_VERSION")"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use HTTPS for public GitHub dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node --test scripts/publish-windows-release.test.mjs
      - run: npm run lint:adaptive-layout -- --all
      - run: npm run audit:readiness -- --check
      - run: npm run audit:tts-assets

  build:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-2022
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/checkout@v4
        with:
          repository: linkasu/LINKa.plays-launcher
          ref: fa165f74b34d6b4f7da1c2f73599439d5f7912c7
          path: build/launcher-source

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Use HTTPS for public GitHub dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: npm ci

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set "buildSha=${GITHUB_SHA}"
          npm run build:native
          npm run build
          npx electron-builder --win --x64 --dir -p never
          dotnet publish build/launcher-source/LINKa.plays-launcher/LINKa.plays-launcher.csproj -c Release -r win-x64 --self-contained true -o release/launcher
          node -e 'const p=require("./package.json");if(!/^\d+\.\d+\.\d+$/.test(p.version))throw Error("Launcher requires a numeric stable version");require("fs").writeFileSync("release/version.json",JSON.stringify({version:p.version}))'

      - name: Build launcher-compatible installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPayloadDir=$pwd\release\win-unpacked" "/DLauncherDir=$pwd\release\launcher" resources/electron/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          Compress-Archive release/launcher release/launcher.zip

      - name: Packaged privacy smoke
        run: npm run smoke:packaged-privacy -- --output release-debug/packaged-privacy-smoke.json --log release-debug/packaged-privacy-smoke.log

      - name: Packaged renderer smoke
        if: runner.os == 'Windows'
        run: npm run smoke:packaged-window -- --screenshot-dir release-debug/screenshots --output release-debug/packaged-window-smoke.json --log release-debug/app.log

      - name: Check genuine Unity upgrade and clean installation
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer = (Get-ChildItem release/*-win-x64.exe).FullName
          ./scripts/ci/windows-installer-smoke.ps1 -Installer $installer
          npm run smoke:packaged-window -- --exe "$env:LOCALAPPDATA\LINKa installer smoke\LINKa.plays.exe" --screenshot-dir release-debug/installed-screenshots --output release-debug/installed-window-smoke.json --log release-debug/installed-app.log

      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-packages-${{ github.run_id }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
            !release/builder-debug.yml
          if-no-files-found: error

      - name: Upload packaged smoke debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-packaged-smoke-debug-${{ github.run_id }}
          path: release-debug/**/*
          if-no-files-found: ignore

  publish:
    needs: [release-version, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-packages-${{ github.run_id }}"
          path: release
          merge-multiple: true

      - name: Publish tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.release-version.outputs.release_tag }}"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; refusing to replace published assets" >&2
            exit 1
          fi
          gh release create "$release_tag" --draft --target "$GITHUB_SHA" --title "$release_tag" --notes ""
          for artifact in release/*; do
            test -f "$artifact"
            if [ "$(basename "$artifact")" = "builder-debug.yml" ]; then
              continue
            fi
            gh release upload "$release_tag" "$artifact"
          done
          # Old Electron updaters must not mistake this Inno bundle for their NSIS update.
          gh release edit "$release_tag" --draft=false --latest=false

  publish-updater-mirror:
    needs: [release-version, publish]
    uses: ./.github/workflows/publish-linka-plays-updater.yml
    secrets: inherit
    with:
      version: ${{ needs.release-version.outputs.release_tag }}
